name: Ruff

on:
  push:
    branches:
      - main
      - github-workflows
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --output-format=github
